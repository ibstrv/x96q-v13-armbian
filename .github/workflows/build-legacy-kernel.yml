name: Build pinned X96Q 6.12.64 kernel packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x96q-v1-3-legacy-kernel
  cancel-in-progress: false

jobs:
  build-kernel-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out the exact framework used by the working image
        uses: actions/checkout@v4
        with:
          repository: sicXnull/armbian-build
          ref: 6e7d2798e
          path: armbian
          fetch-depth: 1

      - name: Verify pinned build revision
        working-directory: armbian
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse --short=7 HEAD)"
          test "$actual" = "6e7d279"
          echo "Pinned Armbian build revision: $actual"

      - name: Restore the X96Q board definition
        working-directory: armbian
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p userpatches/config/boards
          cat > userpatches/config/boards/x96q.conf <<'EOF'
          BOARD_NAME="X96Q TV Box LPDDR3"
          BOARDFAMILY="sun50iw9"
          BOARD_MAINTAINER="sicXnull"
          BOOTCONFIG="x96q_lpddr3_defconfig"
          KERNEL_TARGET="current"
          FORCE_BOOTSCRIPT_UPDATE="yes"
          OVERLAY_PREFIX="sun50i-h616"
          EOF

      - name: Build kernel packages only
        working-directory: armbian
        shell: bash
        run: |
          set -euo pipefail
          ./compile.sh kernel \
            BOARD=x96q \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no

      - name: Show generated packages
        working-directory: armbian
        shell: bash
        run: find output/debs -type f -name '*.deb' -print -exec dpkg-deb -f {} Package Version Description \;

      - name: Reject packages for the wrong kernel
        working-directory: armbian
        shell: bash
        run: |
          set -euo pipefail
          find output/debs -type f -name 'linux-headers*__6.12.64-*.deb' | grep -q .
          find output/debs -type f -name 'linux-image*__6.12.64-*.deb' | grep -q .

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: x96q-pinned-kernel-packages
          path: armbian/output/debs/**/*.deb
          if-no-files-found: error
          retention-days: 14
